<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      text-align: center;
      color: white;
    }
    .logo {
      width: 150px;
      height: 150px;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    p {
      font-size: 32px;
      opacity: 0.95;
      max-width: 900px;
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 24px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="file:///Users/sherry/Documents/Shopimage/client/public/logo.png" alt="Shopimage" class="logo">
    <h1>Shopimage</h1>
    <p>Image Weight Checker & Compress for E-commerce</p>
    <div class="badge">🚀 Boost your shop speed by 70%</div>
  </div>
</body>
</html>
